name: Stock Data Collection

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Both markets are attempted at each scheduled run.
    - cron: '0 23 * * 0-4'   # 08:00 KST Mon-Fri
    - cron: '30 7 * * 1-5'   # 16:30 KST Mon-Fri

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        market: [kr, us]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify checked-out source
        run: |
          set -euo pipefail
          echo "COMMIT=${GITHUB_SHA}"
          echo "BRANCH=${GITHUB_REF}"
          echo "MARKET=${{ matrix.market }}"
          pwd
          ls -l collect.py
          sha256sum collect.py
          python -m py_compile collect.py
          python - <<'PYCODE'
          from pathlib import Path
          s = Path('collect.py').read_text(encoding='utf-8')
          for marker in ['def us_universe():', 'def american():', 'US_LISTING_FETCH', 'US_FATAL_ERROR']:
              print(f'SOURCE_CHECK {marker}: {marker in s}', flush=True)
          print('SOURCE_TAIL_BEGIN', flush=True)
          print('\n'.join(s.splitlines()[-22:]), flush=True)
          print('SOURCE_TAIL_END', flush=True)
          PYCODE
      - name: Collect stock data
        shell: bash
        run: |
          set -uo pipefail
          echo "COMMAND python -u -X faulthandler collect.py ${{ matrix.market }}"
          python -u -X faulthandler collect.py ${{ matrix.market }} 2>&1 | tee "run-${{ matrix.market }}.log"
          status=${PIPESTATUS[0]}
          echo "PYTHON_EXIT_CODE=$status"
          echo "REPORTS_BEGIN"
          ls -lah reports/ || true
          echo "REPORTS_END"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if ! find reports -maxdepth 1 -name '*.csv' -print -quit | grep -q .; then
            echo "ERROR: No CSV produced"
            exit 1
          fi
      - name: Upload CSV results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-data-${{ matrix.market }}-${{ github.run_id }}
          path: |
            reports/*.csv
            run-${{ matrix.market }}.log
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish latest CSV reports
    needs: collect
    if: ${{ needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-stock-reports
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download both market artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stock-data-*-${{ github.run_id }}
          path: downloaded
          merge-multiple: true
      - name: Publish dated and latest CSVs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          shopt -s nullglob
          files=(downloaded/*.csv)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: No CSV artifacts downloaded"
            exit 1
          fi
          cp "${files[@]}" reports/
          python - <<'PYCODE'
          from pathlib import Path
          import shutil
          import re
          root = Path('reports')
          for market in ('kr', 'us'):
              for category in ('all', 'volume_candidates', 'momentum_candidates'):
                  candidates = sorted(
                      p for p in root.glob(f'{market}_{category}_*.csv')
                      if re.fullmatch(rf'{market}_{category}_[0-9]{{8}}\.csv', p.name)
                  )
                  if not candidates:
                      raise SystemExit(f'Missing CSV: {market}_{category}')
                  shutil.copyfile(candidates[-1], root / f'{market}_{category}_latest.csv')
          PYCODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/*.csv
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "Publish latest stock screening CSVs"
          git pull --rebase origin main
          git push origin HEAD:main
