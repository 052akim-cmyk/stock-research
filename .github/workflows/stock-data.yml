name: Stock Data Collection

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Both markets are attempted at each scheduled run.
    - cron: '0 23 * * 0-4'   # 08:00 KST Mon-Fri
    - cron: '30 7 * * 1-5'   # 16:30 KST Mon-Fri

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        market: [kr, us]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect stock data
        run: |
          set -euo pipefail
          python -u collect.py ${{ matrix.market }}
          test -n "$(find reports -maxdepth 1 -name '*.csv' -print -quit)"
          ls -lh reports/
      - name: Upload CSV results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-data-${{ matrix.market }}-${{ github.run_id }}
          path: reports/*.csv
          if-no-files-found: warn
          retention-days: 30
